_metadata:
  description: Manual alias overrides for entity resolution. Maps ground_truth player_name_raw
    to the Wikipedia page slug that contains their career stats.
  usage: When a ground-truth player's name doesn't directly resolve to a stats page
    (disambiguation page, mononym, transliteration variant), look up the canonical
    Wikipedia slug here.
  maintenance: Add entries as new disambiguation cases are discovered during Phase
    3 fuzzy-match review.
