_metadata:
  description: Tier A manually-reasoned weights for the heuristic weighted-sum baseline.
  philosophy: "Manually reasoned from football-domain knowledge of what the Ballon\
    \ d'Or jury has historically weighted. NOT learned. This is the sanity-check floor\
    \ \u2014 every learned model (Tier B/C) must beat these metrics to justify its\
    \ complexity."
  missing_value_handling: "NaN treated as 0 (no signal contribution, no imputation\
    \ per Key Focus Areas \xA79)."
  top1_accuracy: 30.4% (21/69 years)
  top3_hit_rate: 47.8% (33/69 years)
